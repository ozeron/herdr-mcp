id = "herdr-mcp"
name = "Herdr MCP"
version = "0.1.0"
min_herdr_version = "0.9.3"
description = "MCP bridge over Herdr's socket API, with an opt-in installer for Claude and Codex"
platforms = ["linux", "macos"]

[[build]]
command = ["cargo", "install", "--path", ".", "--root", ".", "--locked"]

[[build]]
command = ["bin/herdr-mcp", "install", "--relink-shim"]

[[actions]]
id = "status"
title = "Herdr MCP: install status"
description = "Show whether Claude and Codex have the herdr entry. Writes nothing."
contexts = ["global"]
command = ["bin/herdr-mcp", "install", "--status"]

# Plugin actions run without a terminal, so the interactive installer runs in a pane.
[[panes]]
id = "install"
title = "Herdr MCP: install (read tools)"
description = "Add the herdr MCP server to Claude and Codex with read tools. Shows the plan and asks first."
placement = "split"
command = ["sh", "-c", "bin/herdr-mcp install; printf '\\nPress Enter to close. '; read _"]

[[panes]]
id = "install-control"
title = "Herdr MCP: install (control tools)"
description = "Add the herdr MCP server with control tools, which hold shell authority over every pane. Shows the plan and asks first."
placement = "split"
command = ["sh", "-c", "bin/herdr-mcp install --control; printf '\\nPress Enter to close. '; read _"]

[[panes]]
id = "remove"
title = "Herdr MCP: remove"
description = "Remove the herdr entries and shim that point at this plugin. Shows the plan and asks first."
placement = "split"
command = ["sh", "-c", "bin/herdr-mcp install --remove; printf '\\nPress Enter to close. '; read _"]

[[panes]]
id = "tunnel-setup"
title = "Herdr MCP: ChatGPT tunnel (setup)"
description = "Save your tunnel ID and store the runtime key in the macOS Keychain."
placement = "split"
command = ["sh", "-c", "bin/herdr-mcp tunnel setup; printf '\\nPress Enter to close. '; read _"]

[[panes]]
id = "tunnel-start-full"
title = "Herdr MCP: ChatGPT tunnel (start, full access)"
description = "Start the background tunnel with control tools. ChatGPT can then run commands as you and type into your panes. Shows a disclosure and asks you to type 'full access' first."
placement = "split"
command = ["sh", "-c", "bin/herdr-mcp tunnel start --full; printf '\\nPress Enter to close. '; read _"]

[[actions]]
id = "tunnel-start"
title = "Herdr MCP: ChatGPT tunnel (start, read)"
description = "Start the background tunnel with read tools only. It keeps running until you stop it."
contexts = ["global"]
command = ["bin/herdr-mcp", "tunnel", "start"]

[[actions]]
id = "tunnel-stop"
title = "Herdr MCP: ChatGPT tunnel (stop)"
description = "Stop the background tunnel and remove its LaunchAgent."
contexts = ["global"]
command = ["bin/herdr-mcp", "tunnel", "stop"]

[[actions]]
id = "tunnel-status"
title = "Herdr MCP: ChatGPT tunnel (status)"
description = "Show whether the tunnel runs, its mode, expiry and the last audit lines. Writes nothing."
contexts = ["global"]
command = ["bin/herdr-mcp", "tunnel", "status"]

[[actions]]
id = "tunnel-doctor"
title = "Herdr MCP: ChatGPT tunnel (doctor)"
description = "Check the tunnel client, ID, key, bridge, OpenAI auth and service. Writes nothing."
contexts = ["global"]
command = ["bin/herdr-mcp", "tunnel", "doctor"]
