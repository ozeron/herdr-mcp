[package]
name = "herdr-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "MCP bridge over Herdr's socket API"
publish = false

[lib]
name = "herdr_mcp"
path = "src/lib.rs"

[[bin]]
name = "herdr-mcp"
path = "src/main.rs"

[dependencies]
rmcp = { version = "=3.5.1", features = ["server", "macros", "transport-io"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
tokio-util = { version = "0.7.20", features = ["codec"] }
libc = "0.2"
toml_edit = "0.25"

[dev-dependencies]
rmcp = { version = "=3.5.1", features = ["client"] }
tempfile = "3.27.0"
tokio = { version = "1.54.0", features = ["process", "fs"] }
