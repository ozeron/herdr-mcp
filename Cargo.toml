[package]
name = "herdr-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "MCP bridge over Herdr's socket API"
publish = false

[lib]
name = "herdr_mcp"
path = "src/lib.rs"

[[bin]]
name = "herdr-mcp"
path = "src/main.rs"

[dependencies]
rmcp = { version = "=3.5.1", features = ["server", "macros", "transport-io", "transport-streamable-http-server", "tower"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal", "process"] }
tokio-util = { version = "0.7.20", features = ["codec"] }
libc = "0.2"
toml_edit = "0.25"
futures-util = { version = "0.3", default-features = false }
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto", "use_pem"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }

[dev-dependencies]
rmcp = { version = "=3.5.1", features = ["client"] }
tempfile = "3.27.0"
base64 = "0.22"
tokio = { version = "1.54.0", features = ["process", "fs"] }
